name: Build CooperCo

on:
  push:
    branches:
      - main

# One self-hosted runner serves this repository, so without a group a burst of
# merges has runs contending for it. `cancel-in-progress: false` protects the
# build that is already running: it finishes instead of being killed part-way,
# which matters because it produces the release binaries on that box.
#
# It does not promise a build per commit, and an earlier version of this
# comment wrongly implied it did. GitHub holds at most one pending run per
# group, so when two further merges land while a build is running, the second
# displaces the first in the queue and that intermediate commit is never built.
# The newest commit always is, which is the right behaviour for a deploy — but
# if you need artifacts for one specific commit, this is why they may not
# exist, and per-commit builds would need a different mechanism.
concurrency:
  group: build-cooperco
  cancel-in-progress: false

jobs:
  build:
    name: Build and test app
    runs-on: self-hosted
    # Runs have reached 22 minutes. Without a cap a hung build holds the only
    # self-hosted runner indefinitely.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@trunk

      # `cargo check` used to run here first, for 3m46s. It was redundant:
      # `cargo test` below compiles the same workspace for the same target and
      # reports the same type errors, just with the test harnesses attached.
      # Anything the check would have rejected, the test build rejects too.
      - name: Run cargo tests
        run: cargo test

      - name: Build frontend
        run: trunk build --release --config frontend/Trunk.toml

      - name: Build backend
        run: cargo build --release -p backend
