name: Frontend CI

on:
  pull_request:
    branches:
      - main

# Pushing again to an open pull request supersedes the previous run, so there is
# no reason to keep building the one it replaced.
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@trunk

      - name: Run frontend tests
        run: cargo test -p frontend

      - name: Build frontend
        run: trunk build --config frontend/Trunk.toml
